<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartão de Memória</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Martian+Mono:wght@400;500&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --console: #14173a;      /* fundo */
  --shell: #1d2152;        /* plástico do cartão */
  --shell-hi: #2a2f6e;
  --well: #0f1130;         /* poço do bloco */
  --line: #353b82;
  --text: #e9e8f7;
  --mute: #9a9ccb;
  --slot: #ffc53d;         /* âmbar: ação e contagem */
  --ok: #5be3a0;
  --bad: #ff6b6b;
  --display: "Chakra Petch", "Trebuchet MS", sans-serif;
  --body: "Onest", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh; color: var(--text); font: 400 15px/1.5 var(--body);
  background: radial-gradient(1200px 600px at 80% -10%, #2b2f7a 0%, transparent 60%), var(--console);
  background-attachment: fixed;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--slot); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .78em; letter-spacing: -.02em; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 80px; }

/* ---------- barra superior ---------- */
.top { display: flex; align-items: center; gap: 20px; padding: 18px 0; flex-wrap: wrap; }
.brand { font: 700 15px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
.brand { display: flex; align-items: center; gap: 14px; }
.brand img { height: 44px; width: auto; display: block; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tabs button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--mute);
  font: 600 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.tabs button[aria-selected=true] { color: var(--console); background: var(--text); }
.go { border: 0; border-radius: 10px; padding: 11px 18px; background: var(--slot); color: #2a1e00;
  font: 700 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.go:disabled { opacity: .55; cursor: default; }
.go.busy::after { content: ""; display: inline-block; width: 9px; height: 9px; margin-left: 9px; border-radius: 50%;
  border: 2px solid #2a1e00; border-right-color: transparent; animation: spin .7s linear infinite; vertical-align: -1px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- cabeçalho de estado ---------- */
.state { padding: 34px 0 30px; border-top: 1px solid var(--line); }
.state h1 { margin: 0 0 12px; font: 600 clamp(26px, 4.4vw, 46px)/1.08 var(--display); letter-spacing: -.01em; max-width: 21ch; }
.state h1 b { color: var(--slot); font-weight: 700; }
.state p { margin: 0; color: var(--mute); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.led { width: 9px; height: 9px; border-radius: 50%; background: #5d6094; flex: none; }
.led.on { background: var(--ok); box-shadow: 0 0 0 0 rgba(91,227,160,.6); animation: pulse 2.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(91,227,160,0); } 100% { box-shadow: 0 0 0 0 rgba(91,227,160,0); } }

/* ---------- cartões (um por perfil) ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 26px; align-items: start; }
.card { background: linear-gradient(160deg, var(--shell-hi), var(--shell) 55%); border: 1px solid var(--line);
  border-radius: 18px; padding: 16px 16px 14px; position: relative;
  clip-path: polygon(0 0, calc(100% - 34px) 0, 100% 34px, 100% 100%, 0 100%);
  transition: transform .25s, opacity .25s; }
.card.out { opacity: .62; transform: translateY(10px); background: var(--shell); border-style: dashed; }
.card-label { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 0 26px 14px 12px; border-left: 4px solid var(--slot); margin-bottom: 14px; }
.card.out .card-label { border-left-color: #5d6094; }
.card-label h2 { margin: 0; font: 700 22px/1.1 var(--display); letter-spacing: .01em; }
.card-label small { color: var(--mute); display: block; margin-top: 5px; }
.tag { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 5px; background: var(--slot); color: #2a1e00;
  font: 700 10px/1.5 var(--display); letter-spacing: .1em; text-transform: uppercase; vertical-align: 3px; }
.blocks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.block { aspect-ratio: 1; border-radius: 9px; border: 0; padding: 0; position: relative; background: var(--well);
  box-shadow: inset 0 2px 5px rgba(0,0,0,.5); overflow: hidden; }
button.block { background: var(--well) var(--art, none) center/cover; transition: transform .15s; }
button.block:hover { transform: translateY(-3px); }
.block .ini { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); font: 500 10px var(--mono); }
.block .n { position: absolute; right: 0; bottom: 0; min-width: 20px; padding: 1px 5px; border-radius: 7px 0 0 0;
  background: var(--slot); color: #2a1e00; font: 500 10px/1.5 var(--mono); text-align: center; }
.block.wait { outline: 2px dashed var(--slot); outline-offset: -2px; }
.block.off { filter: grayscale(1) brightness(.6); }
.block.off .n { background: #7a7da8; }
.block.off::after { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(135deg, transparent 0 6px, rgba(20,23,58,.55) 6px 8px); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; color: var(--mute); font-size: 13px; }
.proj { margin-top: 34px; padding: 22px 24px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--shell); }
.proj h3 { margin: 0 0 6px; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--slot); }
.proj p { margin: 0; color: var(--mute); max-width: 78ch; }
.proj-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0 16px; }
.proj-row div { padding: 14px 16px; border-radius: 12px; background: var(--well); }
.proj-row b { display: block; font: 600 26px/1.1 var(--display); }
.proj-row div:first-child b { color: var(--slot); }
.proj-row small { color: var(--mute); }
@media (max-width: 640px) { .proj-row { grid-template-columns: repeat(2, 1fr); } }
.legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 30px; color: var(--mute); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; background: var(--shell-hi); display: inline-block; }
.legend i.w { outline: 2px dashed var(--slot); outline-offset: -2px; }
.legend i.o { background: repeating-linear-gradient(135deg, #4a4d78 0 4px, #2c2f58 4px 6px); }
.legend i.e { background: var(--well); box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }

/* ---------- interruptor ---------- */
.sw { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 13px; color: var(--mute); user-select: none; }
.sw input { position: absolute; opacity: 0; width: 0; height: 0; }
.sw span { width: 36px; height: 20px; border-radius: 20px; background: #3a3f7d; position: relative; flex: none; transition: background .15s; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .15s; }
.sw input:checked + span { background: var(--ok); }
.sw input:checked + span::after { transform: translateX(16px); background: #0d2b1c; }
.sw input:focus-visible + span { outline: 2px solid var(--slot); outline-offset: 2px; }

/* ---------- gaveta do save ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8,9,28,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 5; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--shell); z-index: 6;
  border-left: 1px solid var(--line); transform: translateX(102%); transition: transform .25s; overflow-y: auto; }
.drawer.open { transform: none; }
.art { min-height: 210px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-end; position: relative;
  background: linear-gradient(to top, var(--shell) 4%, rgba(29,33,82,.35) 70%), var(--pic, none) center/cover, var(--shell-hi); }
.art .x { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: rgba(15,17,48,.75); font-size: 18px; line-height: 1; }
.art h3 { margin: 0; font: 700 26px/1.1 var(--display); }
.art p { margin: 6px 0 0; color: var(--text); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chips span { padding: 3px 8px; border-radius: 6px; background: rgba(15,17,48,.7); color: var(--mute); font: 400 11px var(--mono); }
.dbody { padding: 6px 20px 30px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.dbody h4, .panel h3 { margin: 26px 0 4px; font: 600 12px/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.ver { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.ver strong { font-weight: 600; }
.ver small { color: var(--mute); grid-column: 1; }
.ver .acts { grid-row: 1 / span 2; grid-column: 2; align-self: center; display: flex; gap: 6px; }
.ver .acts > * { padding: 8px 11px; border-radius: 8px; border: 1px solid var(--line); background: none;
  color: var(--text); text-decoration: none; font: 600 12px var(--display); letter-spacing: .05em; text-transform: uppercase; }
.ver .acts > *:hover { border-color: var(--slot); color: var(--slot); }
.ver .acts > [aria-pressed=true] { background: var(--slot); border-color: var(--slot); color: #2a1e00; }
details.save { border-bottom: 1px solid var(--line); }
details.save summary { list-style: none; cursor: pointer; padding: 13px 26px 13px 0; position: relative; }
details.save summary::-webkit-details-marker { display: none; }
details.save summary::after { content: "+"; position: absolute; right: 4px; top: 12px; color: var(--slot); font: 600 18px var(--display); }
details.save[open] summary::after { content: "–"; }
details.save summary small { display: block; color: var(--mute); margin-top: 2px; }
details.save .ver { padding-left: 14px; border-bottom: 0; border-top: 1px solid var(--line); }
.chip { padding: 2px 7px; border-radius: 6px; background: var(--well); color: var(--mute); font: 400 10px var(--mono); vertical-align: 2px; }
.note { margin-top: 22px; padding: 14px 16px; border-radius: 12px; background: var(--well); color: var(--mute); font-size: 13.5px; }
.note a { color: var(--slot); }
.note ol { margin: 8px 0 0; padding-left: 20px; }

/* ---------- ajustes ---------- */
.panel { background: var(--shell); border: 1px solid var(--line); border-radius: 16px; padding: 6px 22px 22px; margin-bottom: 20px; }
.panel h3 { margin-top: 22px; color: var(--slot); }
.panel > p { margin: 8px 0 12px; color: var(--mute); max-width: 62ch; }
.f { display: grid; grid-template-columns: minmax(0, 1fr) 190px; gap: 6px 20px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); }
.f label b { font-weight: 500; display: block; }
.f label small { color: var(--mute); }
.f input[type=text], .f input[type=number], .f input[type=password], .f select {
  width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--well); }
.f .sw { justify-self: end; }
.f.wide { grid-template-columns: 1fr; }
.btn { white-space: nowrap; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: none;
  font: 600 12px var(--display); letter-spacing: .05em; text-transform: uppercase; }
.btn:hover { border-color: var(--slot); color: var(--slot); }
.savebar { position: sticky; bottom: 16px; display: flex; justify-content: flex-start; gap: 12px; align-items: center; margin-top: 8px; }
.inline { display: flex; gap: 8px; }

/* ---------- painel ---------- */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.tile { padding: 16px 18px; border-radius: 14px; background: var(--shell); border: 1px solid var(--line); }
.tile b { display: block; font: 600 24px/1.15 var(--display); overflow-wrap: anywhere; }
.tile small { color: var(--mute); }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 16px; }
.chips-row button { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: none; font-size: 13px; color: var(--mute); }
.chips-row button[aria-pressed=true] { background: var(--text); color: var(--console); border-color: var(--text); }
.heat { display: grid; grid-template-columns: 78px repeat(24, 1fr); gap: 3px; align-items: center; }
.heat .lab { color: var(--mute); font-size: 12px; white-space: nowrap; }
.heat .hr { color: var(--mute); font: 400 10px var(--mono); text-align: left; }
.heat .c { aspect-ratio: 1; max-height: 26px; border-radius: 4px; background: var(--well); }
.heat .c[data-v="1"] { background: rgba(255,197,61,.24); } .heat .c[data-v="2"] { background: rgba(255,197,61,.4); }
.heat .c[data-v="3"] { background: rgba(255,197,61,.55); } .heat .c[data-v="4"] { background: rgba(255,197,61,.7); }
.heat .c[data-v="5"] { background: rgba(255,197,61,.85); } .heat .c[data-v="6"] { background: #ffc53d; }
.heat .c[data-tip]:hover { outline: 2px solid var(--text); outline-offset: 1px; }
.scale { display: flex; align-items: center; gap: 4px; margin-top: 14px; color: var(--mute); font-size: 12px; }
.scale i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.bars { display: grid; grid-template-columns: minmax(120px, 34%) 1fr auto; gap: 10px 14px; align-items: center; margin-top: 14px; }
.bars .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .name small { color: var(--mute); }
.bars .track { height: 12px; }
.bars .fill { height: 100%; min-width: 3px; border-radius: 0 4px 4px 0; background: var(--slot); }
.bars.space .fill { background: #8f96ff; }
.bars .val { font: 400 12px var(--mono); color: var(--text); white-space: nowrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.two .panel { margin-bottom: 20px; }
svg.curve { width: 100%; height: auto; display: block; margin-top: 10px; overflow: visible; }
svg.curve text { fill: var(--mute); font: 400 11px var(--body); }
svg.curve .val { fill: var(--text); font-weight: 600; }
#tip { position: fixed; z-index: 20; pointer-events: none; padding: 8px 11px; border-radius: 8px; background: var(--text); color: var(--console);
  font-size: 12.5px; line-height: 1.4; max-width: 280px; opacity: 0; transition: opacity .1s; }
#tip.on { opacity: 1; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } .heat { grid-template-columns: 54px repeat(24, 1fr); gap: 2px; } }

/* ---------- registro ---------- */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.feed img, .feed .ph { width: 44px; height: 44px; border-radius: 9px; object-fit: cover; background: var(--well); }
.feed small { color: var(--mute); display: block; }
.feed time { color: var(--mute); font-size: 13px; white-space: nowrap; }
pre.log { margin: 14px 0 0; padding: 16px; border-radius: 12px; background: var(--well); color: var(--mute);
  font: 400 11.5px/1.7 var(--mono); max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.empty { padding: 60px 20px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 16px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 80px); padding: 12px 18px; border-radius: 10px;
  background: var(--text); color: var(--console); font-weight: 500; transition: transform .25s; z-index: 9; max-width: 90vw; }
.toast.show { transform: translate(-50%, 0); }
.toast.err { background: var(--bad); color: #2b0606; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
  .tabs { margin-left: 0; order: 3; width: 100%; }
  .go { margin-left: auto; }
  .f { grid-template-columns: 1fr; }
  .f .sw { justify-self: start; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img src="/mark.svg" alt="">Cartão de Memória</div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="cards" aria-selected="true" data-i18n="tab_cards">Cartões</button>
      <button role="tab" data-tab="stats" aria-selected="false" data-i18n="tab_stats">Painel</button>
      <button role="tab" data-tab="settings" aria-selected="false" data-i18n="tab_settings">Ajustes</button>
      <button role="tab" data-tab="log" aria-selected="false" data-i18n="tab_log">Registro</button>
    </nav>
    <button class="go" id="go" data-i18n="go">Copiar agora</button>
  </header>

  <section class="state">
    <h1 id="headline" data-i18n="loading">Lendo o cartão…</h1>
    <p><span class="led" id="led"></span><span id="statusline"></span></p>
  </section>

  <main>
    <section id="tab-cards">
      <div class="cards" id="cards"></div>
      <div class="legend">
        <span><i></i><span data-i18n="legend_saved"></span></span>
        <span><i class="w"></i><span data-i18n="legend_wait"></span></span>
        <span><i class="o"></i><span data-i18n="legend_off"></span></span>
        <span><i class="e"></i><span data-i18n="legend_free"></span></span>
      </div>
      <div class="proj" id="proj" hidden></div>
    </section>
    <section id="tab-stats" hidden></section>
    <section id="tab-settings" hidden></section>
    <section id="tab-log" hidden></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" data-i18n-aria="drawer_aria"></aside>
<div class="toast" id="toast" role="status"></div>
<div id="tip" role="tooltip"></div>

<script>
/* i18n:start */
const I18N = {
  "pt-BR": {
    tab_cards: "Cartões", tab_stats: "Painel", tab_settings: "Ajustes", tab_log: "Registro",
    go: "Copiar agora", going: "Copiando", loading: "Lendo o cartão…", drawer_aria: "Detalhes do save",
    legend_saved: "Jogo guardado (o número é a quantidade de saves)", legend_wait: "Aguardando a primeira cópia",
    legend_off: "Fora do backup", legend_free: "Espaço livre",
    saves: ["{n} save", "{n} saves"], versions: ["{n} versão", "{n} versões"], games: ["{n} jogo", "{n} jogos"],
    copies: ["{n} cópia", "{n} cópias"], versions_stored: ["{n} versão guardada", "{n} versões guardadas"],
    ago_now: "agora há pouco", ago_min: "há {n} min", ago_h: "há {n} h", ago_d: ["há {n} dia", "há {n} dias"],
    failed: "Falhou", no_service: "Sem resposta do serviço de backup.",
    headline: ["<b>{saves}</b> guardado em {versions}, {size} no servidor.", "<b>{saves}</b> guardados em {versions}, {size} no servidor."],
    headline_none: "Nenhum save guardado ainda.", over_limit: "Acima do limite de espaço.",
    last_check: "Última verificação {ago}.", last_check_why: "Última verificação {ago}, motivo: {why}.",
    st_running: "Copiando os saves do PS5…", st_online: "PS5 ligado em {host}. {last}",
    st_offline: "PS5 desligado, em repouso ou sem o desbloqueio. A cópia volta sozinha quando ele reaparecer. {last}",
    trig_manual: "Manual", trig_power_on: "PS5 ligou", trig_save_changed: "Save alterado", trig_schedule: "Agendamento",
    proj_title: "Projeção de espaço", proj_today_basis: "de hoje", proj_days_basis: "dos últimos {n} dias",
    proj_pace: "Repetindo o ritmo {basis}: {copies} cópias e {size} lidos do PS5 por dia.",
    proj_idle: "Nenhuma cópia nova {basis}; a projeção considera só o que já está guardado.",
    proj_how: "Cada dia futuro é simulado com as regras de limpeza de Ajustes, não é uma linha reta.",
    today: "hoje", in_30: "em 30 dias", in_90: "em 90 dias", in_year: "em 1 ano", less_than: "menos de {v}",
    proj_share: "Em um ano isso seria {share}% do espaço que o disco tem hoje para os backups ({free} livres). Sem a limpeza, o mesmo ritmo chegaria a {raw}.",
    proj_more_days: "A estimativa melhora conforme juntar mais dias de uso (hoje: {n}).",
    cards_empty: "Ainda não li nenhum perfil. Ligue o PS5, rode o desbloqueio com o ftpsrv e toque em “Copiar agora”.",
    block_tip: "{game}: {saves}, {versions}", card_empty: "Nenhum save neste perfil", tag_new: "novo",
    in_backup: "No backup", out_backup: "Fora do backup",
    sv_none: "nenhuma versão guardada", sv_wait: "aguardando a primeira cópia",
    sv_gone: "{versions} · não está mais no console", sv_last: "{versions} · última {ago}",
    newest: "mais recente", pin_tip: "Uma versão fixada nunca é apagada pela limpeza.", pinned: "Fixada", pin: "Fixar",
    download: "Baixar", system_copy: "reserva do jogo", no_versions: "Sem versões guardadas.", close: "Fechar",

  if (!r.ok) throw new Error(j.error || t("failed"));
  return j;
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); await refresh(true); return r; }
  catch (e) { toast(e.message, true); }
}
async function refresh(force) {

let statsFilter = "", statsData = null, verifying = false;
const dur = slots => { const m = slots * 10, h = Math.floor(m / 60); return h ? `${h} h${m % 60 ? " " + (m % 60) + " min" : ""}` : `${m} min`; };
const dayLabel = iso => new Date(iso + "T12:00").toLocaleDateString(lang, { weekday: "short", day: "2-digit", month: "2-digit" }).replace(".", "");
const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const profileName = uid => data.profiles.find(p => p.uid === uid)?.name || uid;

async function renderStats() {
  try { statsData = await (await fetch("/api/stats")).json(); } catch (e) { if (!statsData) return; }
  const DAYS = 14, days = [...Array(DAYS)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - i); return isoDay(d); });
  const slotsOf = day => Object.entries(statsData.slots[day] || {}).filter(([k]) => !statsFilter || k.startsWith(statsFilter + "|"));
  const perKey = new Map(); // tempo por jogo e perfil
  days.forEach(day => slotsOf(day).forEach(([k, sl]) => perKey.set(k, (perKey.get(k) || 0) + sl.length)));
  const ranked = [...perKey].sort((a, b) => b[1] - a[1]);
  const today = slotsOf(days[0]).reduce((n, [, sl]) => n + sl.length, 0), total = ranked.reduce((n, [, v]) => n + v, 0);
  const perDay = days.map(day => [day, slotsOf(day).reduce((n, [, sl]) => n + sl.length, 0)]).sort((a, b) => b[1] - a[1])[0];
  const uids = [...new Set(days.flatMap(day => Object.keys(statsData.slots[day] || {}).map(k => k.split("|")[0])))];

  const head = `<span></span>` + [...Array(24)].map((_, h) => `<span class="hr">${h % 3 ? "" : h}</span>`).join("");
  const rows = days.map(day => {
    const entries = slotsOf(day);
    return `<span class="lab">${dayLabel(day)}</span>` + [...Array(24)].map((_, h) => {
      const active = new Set(), who = [];
      entries.forEach(([k, sl]) => { const mine = sl.filter(x => Math.floor(x / 6) === h);
        if (mine.length) { mine.forEach(x => active.add(x)); const [u, ti] = k.split("|"); who.push(`${gameName(ti)} (${profileName(u)})`); } });
      const v = active.size;
      return v ? `<span class="c" data-v="${v}" data-tip="${esc(t("heat_tip", { day: dayLabel(day), h, min: v * 10, who: who.join(", ") }))}"></span>` : `<span class="c"></span>`;
    }).join("");
  }).join("");

  const maxT = ranked[0]?.[1] || 1;
  const timeBars = ranked.slice(0, 8).map(([k, v]) => { const [u, ti] = k.split("|");
    return `<span class="name">${esc(gameName(ti))} <small>· ${esc(profileName(u))}</small></span>
      <span class="track" data-tip="${esc(t("time_tip", { game: gameName(ti), profile: profileName(u), time: dur(v), n: DAYS }))}"><div class="fill" style="width:${v / maxT * 100}%"></div></span><span class="val">${dur(v)}</span>`; }).join("");
  const space = Object.entries(data.titles).filter(([, ti]) => ti.bytes).sort((a, b) => b[1].bytes - a[1].bytes);

  $("#tab-stats").innerHTML = `
    <div class="tiles">
      <div class="tile"><b>${today ? dur(today) : t("nothing")}</b><small>${t("tile_today")}</small></div>
      <div class="tile"><b>${total ? dur(total) : t("nothing")}</b><small>${t("tile_days", { n: DAYS })}</small></div>

function curveSvg() {
  const p = data.projection;
  if (!p || !p.curve) return `<p>${t("curve_wait")}</p>`;
  const now = new Date(), past = Object.entries(statsData.sizes || {}).map(([day, b]) => [Math.round((new Date(day + "T12:00") - now) / 864e5), b])
    .filter(([d]) => d < 0 && d >= -60).sort((a, b) => a[0] - b[0]);
  const fut = p.curve, all = [...past, ...fut];
  const W = 860, H = 280, L = 56, R = 70, T = 18, B = 34;
  const x0 = all[0][0], x1 = 365, yMax = Math.max(...all.map(q => q[1])) * 1.15 || 1;
  const X = d => L + (d - x0) / (x1 - x0) * (W - L - R), Y = b => H - B - b / yMax * (H - T - B);
  const path = pts => pts.map((q, i) => `${i ? "L" : "M"}${X(q[0]).toFixed(1)} ${Y(q[1]).toFixed(1)}`).join(" ");
  const grid = [0.25, 0.5, 0.75, 1].map(f => { const v = yMax * f / 1.15;
    return `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#353b82" stroke-width="1"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${gb(v)}</text>`; }).join("");
  const marks = [[30, t("d30")], [90, t("d90")], [365, t("y1")]].map(([d, label]) => { const b = fut.find(q => q[0] === d)?.[1] ?? 0;
    return `<circle cx="${X(d)}" cy="${Y(b)}" r="5" fill="#ffc53d" stroke="#1d2152" stroke-width="2"/>
      <text class="val" x="${X(d)}" y="${Y(b) - 12}" text-anchor="${d === 365 ? "start" : "middle"}" ${d === 365 ? `dx="10" dy="16"` : ""}>${gb(b)}</text>
      <text x="${X(d)}" y="${H - 10}" text-anchor="middle">${label}</text>`; }).join("");
  const pts = JSON.stringify(all.map(q => [q[0], q[1], +X(q[0]).toFixed(1), +Y(q[1]).toFixed(1)]));
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" data-pts='${pts}' role="img" aria-label="${esc(t("curve_aria", { a: gb(p.projected["30"]), b: gb(p.projected["90"]), c: gb(p.projected["365"]) }))}">
    ${grid}<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#353b82"/>
    <line x1="${X(0)}" x2="${X(0)}" y1="${T}" y2="${H - B}" stroke="#9a9ccb" stroke-dasharray="2 4"/><text x="${X(0)}" y="${H - 10}" text-anchor="middle">${t("today")}</text>
    ${past.length ? `<path d="${path([...past, fut[0]])}" fill="none" stroke="#ffc53d" stroke-width="2"/>` : ""}
    <path d="${path(fut)}" fill="none" stroke="#ffc53d" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
    <line class="cross" y1="${T}" y2="${H - B}" stroke="#e9e8f7" stroke-width="1" opacity="0"/><circle class="dot" r="5" fill="#e9e8f7" stroke="#1d2152" stroke-width="2" opacity="0"/>
    ${marks}</svg>`;
}

const tip = (text, e) => { const el = $("#tip"); if (!text) return el.classList.remove("on"); el.textContent = text; el.classList.add("on");
  const w = el.offsetWidth; el.style.left = Math.min(window.innerWidth - w - 10, Math.max(10, e.clientX + 14)) + "px"; el.style.top = (e.clientY + 16) + "px"; };
document.addEventListener("mousemove", e => {
  const svg = e.target.closest?.("svg.curve");
  if (svg) {
    const pts = JSON.parse(svg.dataset.pts), box = svg.getBoundingClientRect(), mx = (e.clientX - box.left) / box.width * 860;
    const q = pts.reduce((a, b) => Math.abs(b[2] - mx) < Math.abs(a[2] - mx) ? b : a);
    const cross = svg.querySelector(".cross"), dot = svg.querySelector(".dot");
    cross.setAttribute("x1", q[2]); cross.setAttribute("x2", q[2]); cross.setAttribute("opacity", ".5");
    dot.setAttribute("cx", q[2]); dot.setAttribute("cy", q[3]); dot.setAttribute("opacity", "1");
    return tip(t(q[0] === 0 ? "tip_today" : q[0] < 0 ? "tip_past" : "tip_future", { n: Math.abs(q[0]), size: gb(q[1]) }), e);
  }
  document.querySelectorAll("svg.curve .cross, svg.curve .dot").forEach(el => el.setAttribute("opacity", "0"));
  tip(e.target.closest?.("[data-tip]")?.dataset.tip, e);
});

/* ---------- registro ---------- */
async function renderLog() {
  const events = allSaves().flatMap(s => s.versions.map(v => ({ s, v }))).sort((a, b) => b.v.stamp.localeCompare(a.v.stamp));
  const groups = [];
  for (const e of events) { // cópias do mesmo jogo e perfil, com menos de 30 min entre si, viram uma linha
    const last = groups.at(-1);
    if (last && last.s.title === e.s.title && last.s.uid === e.s.uid && stampDate(last.oldest) - stampDate(e.v.stamp) < 18e5) {
      last.count++; last.bytes += e.v.size; last.oldest = e.v.stamp;
      last.names.set(e.v.label || e.s.label || e.s.name, (last.names.get(e.v.label || e.s.label || e.s.name) || 0) + 1);
    } else groups.push({ s: e.s, newest: e.v.stamp, oldest: e.v.stamp, count: 1, bytes: e.v.size,
      names: new Map([[e.v.label || e.s.label || e.s.name, 1]]) });
  }
  const feed = groups.length ? `<ul class="feed">${groups.slice(0, 40).map(g => `<li>
      ${data.titles[g.s.title]?.icon ? `<img src="/art/${g.s.title}/icon0.png" alt="">` : `<span class="ph"></span>`}
      <div><b>${esc(gameName(g.s.title))}</b> · ${tn(g.count, "copies")}
        <small>${esc(g.s.profile.name)} · ${mb(g.bytes)} · ${[...g.names].map(([n, c]) => esc(n) + (c > 1 ? " ×" + c : "")).join(", ")}</small></div>
      <time title="${full(stampDate(g.newest))}">${ago(stampDate(g.newest))}</time></li>`).join("")}</ul>`
    : `<div class="empty">${t("feed_none")}</div>`;
  let lines = [];
  try { lines = (await (await fetch("/api/log")).json()).lines; } catch (e) {}
  const keep = $("#tab-log details")?.open, vf = data.verify;
  const out = !vf.at ? t("verify_never") : t("verify_last", { ago: ago(new Date(vf.at * 1000)) }) + " "
    + (vf.bad.length ? t("verify_bad", { n: vf.bad.length, list: vf.bad.join(", ") }) : tn(vf.ok, "verify_ok"));
  $("#tab-log").innerHTML = `<div class="panel"><h3>${t("feed_title")}</h3>${feed}</div>
    <div class="panel"><h3>${t("integrity")}</h3><p>${t("integrity_p")}</p>
      <button class="btn" id="verify">${t("verify_now")}</button> <span id="verifyOut" style="margin-left:10px;color:var(${vf.bad.length ? "--bad" : "--mute"})">${verifying ? t("verifying") : esc(out)}</span>
      <details ${keep ? "open" : ""} style="margin-top:18px"><summary style="cursor:pointer;color:var(--mute)">${t("tech_log")}</summary>
      <pre class="log">${esc(lines.join("\n")) || t("log_empty")}</pre></details></div>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button, a");
  if (!el) return;
  if (el.dataset.tab) {
    tab = el.dataset.tab;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b === el));
    ["cards", "stats", "settings", "log"].forEach(x => $("#tab-" + x).hidden = x !== tab);
    if (tab === "stats") renderStats();
    if (tab === "settings") renderSettings();
    if (tab === "log") renderLog();
  } else if (el.dataset.key) openDrawer(el.dataset.key);
  else if (el.dataset.who !== undefined) { statsFilter = el.dataset.who; renderStats(); }
  else if (el.id === "closeDrawer") closeDrawer();
  else if (el.dataset.pin) {
    const [uid, title] = openKey.split("/"), pinned = el.getAttribute("aria-pressed") !== "true";
    act(() => post("/api/pin", { uid, title, file: el.dataset.file, stamp: el.dataset.pin, pinned }), pinned ? t("t_pinned") : t("t_unpinned"));
  }
  else if (el.id === "go") { await act(() => post("/api/backup"), t("t_started")); }
  else if (el.id === "saveCfg") { const ok = await act(() => post("/api/config", collectConfig()), t("t_saved")); if (ok) renderSettings(); }
  else if (el.id === "hookSave") { const ok = await act(() => post("/api/webhook", { url: $("#hook").value }), t("t_hook")); if (ok) renderSettings(); }
  else if (el.id === "hookTest") act(() => post("/api/webhook/test"), t("t_test"));
  else if (el.id === "verify") {
    verifying = true; $("#verifyOut").textContent = t("verifying");
    try { await post("/api/verify"); } catch (err) { toast(err.message, true); }
    verifying = false; await refresh(true);
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "uiLang") setLang(el.value);
  else if (el.dataset.profile) {
    act(() => post("/api/profile", { uid: el.dataset.profile, mode: el.checked ? "include" : "exclude" }),
      el.checked ? t("t_profile_in") : t("t_profile_out"));
  } else if (el.dataset.title) {
    act(() => post("/api/title", { id: el.dataset.title, excluded: !el.checked }), el.checked ? t("t_game_in") : t("t_game_out"));
  } else if (el.dataset.path) formDirty = true;
});
document.addEventListener("input", e => { if (e.target.dataset.path) formDirty = true; });
document.addEventListener("toggle", e => {
  const d = e.target;
  if (d.dataset?.save) d.open ? openSaves.add(d.dataset.save) : openSaves.delete(d.dataset.save);
}, true);
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

applyStatic();
refresh();
setInterval(refresh, 4000);
</script>
