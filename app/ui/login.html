<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memcard</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --console: #14173a; --shell: #1d2152; --well: #0f1130; --line: #353b82; --text: #e9e8f7; --mute: #9a9ccb;
  --slot: #ffc53d; --bad: #ff6b6b; --display: "Chakra Petch", "Trebuchet MS", sans-serif; --body: "Onest", system-ui, sans-serif; }
* { box-sizing: border-box; }
html { color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: var(--text); font: 400 15px/1.5 var(--body);
  background: radial-gradient(1200px 600px at 80% -10%, #2b2f7a 0%, transparent 60%), var(--console); background-attachment: fixed; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--slot); outline-offset: 2px; }
form { width: min(380px, 100%); background: var(--shell); border: 1px solid var(--line); border-radius: 16px; padding: 28px 26px 26px; }
.brand { display: flex; align-items: center; gap: 14px; font: 700 15px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
.brand img { height: 44px; width: auto; }
p { margin: 22px 0 16px; color: var(--mute); }
label { display: block; font-weight: 500; margin-bottom: 6px; }
input { width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--well); }
button { margin-top: 16px; width: 100%; border: 0; border-radius: 10px; padding: 13px 18px; background: var(--slot); color: #2a1e00; cursor: pointer;
  font: 700 13px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
button:disabled { opacity: .55; cursor: default; }
#err { min-height: 1.5em; margin: 12px 0 0; color: var(--bad); font-size: 13.5px; }
</style>
</head>
<body>
<form id="form">
  <div class="brand"><img src="/mark.svg" alt="">Memcard</div>
  <p data-i18n="intro"></p>
  <label for="password" data-i18n="label"></label>
  <input type="password" id="password" autocomplete="current-password" autofocus required>
  <button id="enter" data-i18n="enter"></button>
  <div id="err" role="alert"></div>
</form>
<script>
const I18N = {
  "pt-BR": { intro: "Esta interface está protegida por senha.", label: "Senha", enter: "Entrar", failed: "Não foi possível entrar.", offline: "Sem resposta do serviço de backup." },
  en: { intro: "This interface is password-protected.", label: "Password", enter: "Sign in", failed: "Could not sign in.", offline: "The backup service is not responding." },
};
let stored = "";
try { stored = localStorage.getItem("lang") || ""; } catch (e) {}
const lang = I18N[stored] ? stored : (navigator.language || "").toLowerCase().startsWith("pt") ? "pt-BR" : "en";
document.documentElement.lang = lang;
document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = I18N[lang][el.dataset.i18n]);
document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const button = document.getElementById("enter"), err = document.getElementById("err");
  button.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-Lang": lang },
      body: JSON.stringify({ password: document.getElementById("password").value }) });
    if (r.ok) return location.reload();
    err.textContent = (await r.json()).error || I18N[lang].failed;
  } catch (e2) { err.textContent = I18N[lang].offline; }
  button.disabled = false;
});
</script>
</body>
</html>
