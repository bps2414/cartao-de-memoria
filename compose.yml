services:
  ps5-backup:
    # Imagem pronta, publicada a cada push na main. Para rodar o código desta pasta
    # (alterações suas, ou sem acesso ao registro): docker compose up -d --build
    image: ghcr.io/bps2414/memcard:latest
    build: .
    container_name: ps5-backup
    restart: unless-stopped
    labels:
      # O Watchtower (abaixo) só atualiza containers com este rótulo.
      - com.centurylinklabs.watchtower.enable=true
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      NOTIFY_URL: ${NOTIFY_URL:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
    ports:
      # Interface web, só na rede local. Não encaminhe esta porta no roteador.
      - "${WEB_PORT:-8765}:8765"
    volumes:
      # Gravável: a interface web salva os ajustes neste arquivo.
      - ./config.toml:/config/config.toml
      - ${BACKUP_DIR:-./data}:/data

  # Atualização automática: a cada 15 min confere se há imagem nova na main
  # (ghcr.io/bps2414/memcard:latest), baixa e recria o ps5-backup. Os dados ficam
  # nos volumes e não se perdem. Não use com `--build` (ele trocaria o seu código
  # local pela imagem do registro). Para desligar: remova este serviço.
  # Atenção: o docker.sock dá controle total do Docker neste servidor.
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: ps5-backup-updater
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "900"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
